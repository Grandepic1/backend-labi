[project]
name = "backend-labi"
version = "0.1.0"
description = "FastAPI backend for LabI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "asyncmy>=0.2",
    # faster-whisper 1.2.1 calls av.open(metadata_errors=...), which PyAV 19
    # dropped — decoded audio fails without this cap.
    "av>=11,<19",
    "bcrypt>=4.0",
    "cryptography>=44.0",
    "email-validator>=2.0",
    "fastapi>=0.115",
    "faster-whisper>=1.2",
    "greenlet>=3.0",
    "httpx>=0.28",
    "pydantic-settings>=2.5",
    "pyjwt>=2.10",
    "pymysql>=1.1",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.alembic]
script_location = "alembic"
